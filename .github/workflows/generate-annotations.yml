name: Generate ISM annotations

on:
  workflow_dispatch:
    inputs:
      generation_target:
        description: Candidate corpus to generate
        required: true
        default: annotations
        type: choice
        options:
          - annotations
          - mitigation-mappings
          - mitigation-canary

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: generate-ism-annotations
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.generation_target != 'mitigation-mappings'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          python-version: 3.12.13
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12.13

      - name: Build bootstrap database
        if: inputs.generation_target == 'annotations'
        env:
          UV_FROZEN: "true"
        run: >-
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13
          python -m rule1_ingest.build --root . --output build/rule1.sqlite3

      - name: Generate missing or stale descriptions
        if: inputs.generation_target == 'annotations'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UV_FROZEN: "true"
        run: |
          test -n "${OPENROUTER_API_KEY:-}"
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.annotations generate \
            --database build/rule1.sqlite3 \
            --cache annotations/ism.json \
            --batch-size 1

      - name: Verify complete deterministic output
        if: inputs.generation_target == 'annotations'
        env:
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.build --root . --output build/rule1.sqlite3
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.annotations check \
            --database build/rule1.sqlite3 --cache annotations/ism.json --require-complete
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.validate --root . --database build/rule1.sqlite3 \
            --write-contract --contract ingestion/validation-contract.json
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.validate --root . --database build/rule1.sqlite3 \
            --contract ingestion/validation-contract.json

      - name: Retain generation checkpoint
        if: always() && inputs.generation_target == 'annotations'
        uses: actions/upload-artifact@v4
        with:
          name: ism-annotation-checkpoint-${{ github.run_id }}
          path: annotations/ism.json
          if-no-files-found: error
          retention-days: 7

      - name: Create or update annotation review pull request
        if: inputs.generation_target == 'annotations'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- annotations/ism.json ingestion/validation-contract.json; then
            echo "Annotation cache is already current."
            exit 0
          fi
          branch="codex/update-ism-annotations"
          remote_oid="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -- annotations/ism.json ingestion/validation-contract.json
          git commit -m "#42: Update generated ISM annotations"
          if [ -n "$remote_oid" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_oid" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "#42: Update generated ISM annotations" \
              --body "Updates the reviewed, deterministic ISM annotation cache generated by the approval-triggered workflow."
          fi
          gh workflow run build-sqlite.yml --ref "$branch"

      - name: Generate conservative mitigation canary
        if: inputs.generation_target == 'mitigation-canary'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.mitigation_mappings generate-canary \
            --root . \
            --cache build/ism-attack-mitigation-canary.json \
            --batch-size 7

      - name: Retain mitigation canary checkpoint
        if: always() && inputs.generation_target == 'mitigation-canary'
        uses: actions/upload-artifact@v4
        with:
          name: ism-attack-mitigation-canary-${{ github.run_id }}
          path: build/ism-attack-mitigation-canary.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify conservative mitigation canary
        if: inputs.generation_target == 'mitigation-canary'
        env:
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.mitigation_mappings verify-canary \
            --root . \
            --cache build/ism-attack-mitigation-canary.json

  mitigation-shards:
    if: inputs.generation_target == 'mitigation-mappings'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          python-version: 3.12.13
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12.13

      - name: Generate control-to-mitigation shard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.mitigation_mappings generate-shard \
            --root . \
            --shard-index ${{ matrix.shard }} \
            --tracked-cache mappings/ism-attack-mitigation-assessments.json \
            --cache build/mitigation-shards/shard-${{ matrix.shard }}.json \
            --batch-size 20

      - name: Retain shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ism-attack-mitigation-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: build/mitigation-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  merge-mitigation-shards:
    if: always() && inputs.generation_target == 'mitigation-mappings'
    needs: mitigation-shards
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          python-version: 3.12.13
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12.13

      - name: Prepare shard checkpoint directory
        run: mkdir -p build/mitigation-shards

      - name: Download available shard checkpoints
        id: download-shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ism-attack-mitigation-shard-*-${{ github.run_id }}
          path: build/mitigation-shards
          merge-multiple: true

      - name: Merge available shard checkpoints
        if: always()
        env:
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.mitigation_mappings merge-shards \
            --root . \
            --shard-dir build/mitigation-shards \
            --cache build/ism-attack-mitigation-combined.json

      - name: Require the complete control partition after eight successful shards
        if: needs.mitigation-shards.result == 'success'
        env:
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.mitigation_mappings merge-shards \
            --root . \
            --shard-dir build/mitigation-shards \
            --cache build/ism-attack-mitigation-combined.json \
            --require-complete

      - name: Retain combined mitigation checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ism-attack-mitigation-combined-${{ github.run_id }}
          path: build/ism-attack-mitigation-combined.json
          if-no-files-found: error
          retention-days: 7
