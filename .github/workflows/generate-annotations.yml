name: Generate ISM annotations

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: generate-ism-annotations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
          python-version: 3.12.13
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12.13

      - name: Build bootstrap database
        env:
          UV_FROZEN: "true"
        run: >-
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13
          python -m rule1_ingest.build --root . --output build/rule1.sqlite3

      - name: Generate missing or stale descriptions
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UV_FROZEN: "true"
        run: |
          test -n "${OPENROUTER_API_KEY:-}"
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.annotations generate \
            --database build/rule1.sqlite3 \
            --cache annotations/ism.json \
            --batch-size 1

      - name: Verify complete deterministic output
        env:
          UV_FROZEN: "true"
        run: |
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.build --root . --output build/rule1.sqlite3
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.annotations check \
            --database build/rule1.sqlite3 --cache annotations/ism.json --require-complete
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.validate --root . --database build/rule1.sqlite3 \
            --write-contract --contract ingestion/validation-contract.json
          PYTHONPATH=ingestion uv run --frozen --python 3.12.13 \
            python -m rule1_ingest.validate --root . --database build/rule1.sqlite3 \
            --contract ingestion/validation-contract.json

      - name: Retain generation checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ism-annotation-checkpoint-${{ github.run_id }}
          path: annotations/ism.json
          if-no-files-found: error
          retention-days: 7

      - name: Create or update annotation review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- annotations/ism.json ingestion/validation-contract.json; then
            echo "Annotation cache is already current."
            exit 0
          fi
          branch="codex/update-ism-annotations"
          remote_oid="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -- annotations/ism.json ingestion/validation-contract.json
          git commit -m "#42: Update generated ISM annotations"
          if [ -n "$remote_oid" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_oid" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "#42: Update generated ISM annotations" \
              --body "Updates the reviewed, deterministic ISM annotation cache generated by the approval-triggered workflow."
          fi
          gh workflow run build-sqlite.yml --ref "$branch"
